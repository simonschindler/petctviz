[project]
name = "petctviz-preprocess"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
